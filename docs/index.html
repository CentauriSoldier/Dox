    <style>
            :root {
        --base-font-size: 16px;
        --page: #101824;
        --surface: #182435;
        --surface-raised: #203047;
        --border: #30445f;
        --text: #e4edf7;
        --muted: #9cabc1;
        --accent: #79baff;
        --accent-soft: #223e5d;
        --navbackground: #182435;
        --navlink: #bcd9fa;
        --navlinkhover: #ffffff;
        --sectiontitle: #dcecff;
        --sectiontitlebg: #203047;
        --sectioncontent: #e4edf7;
        --breadcrumb-background: #141f2e;
        --button-background: #2b4562;
        --button-border: #4b6c90;
        --button-hover: #365c85;
        --button-text: #edf6ff;
        --header-end: #1c2435;
        --header-start: #172b44;
        --link-hover: #b9ddff;
        --selected-border: #5487b6;
        --selected-text: #ffffff;
    }

    /* Page shell and compact project identity. */
    * { box-sizing: border-box; }
    html { font-size: var(--base-font-size); }
    body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.65;
    }
    a { color: var(--accent); }
    a:hover { color: var(--link-hover); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #titlebg {
        padding: 24px 36px 22px;
        background: linear-gradient(120deg, var(--header-start), var(--header-end));
        border-bottom: 1px solid var(--border);
    }
    .dox-brand { color: var(--accent); font-weight: 800; letter-spacing: .14em; font-size: .85rem; }
    .dox-brand span { margin-left: 12px; color: var(--muted); font-size: .7rem; font-weight: 600; }
    #title { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 700; margin: 8px 0 0; letter-spacing: -.025em; }
    .dox-subtitle { margin: 3px 0 0; color: var(--muted); font-size: .85rem; }

    /* Breadcrumbs and selected items show the current location without relying on color alone. */
    #DOX_breadcrumb-wrapper { padding: 13px 36px; background: var(--breadcrumb-background); border-bottom: 1px solid var(--border); }
    #DOX_breadcrumb { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; font-size: .9rem; }
    .breadcrumb-item + .breadcrumb-item::before { content: "/"; color: var(--muted); padding-right: 8px; float: none; }
    .breadcrumb-item.active { color: var(--text); font-weight: 700; }
    .breadcrumb a { text-decoration: none; }
    .dox-workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 185px); }
    #DOX_navmenu_wrapper { background: var(--surface); padding: 26px 18px; border-right: 1px solid var(--border); }
    #DOX_navheading { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0 12px; margin: 0 0 14px; overflow-wrap: anywhere; }
    #DOX_navmenu { margin: 0; padding: 0; list-style: none; gap: 5px; }
    #DOX_navmenu .nav-link { display: block; color: var(--navlink); padding: 11px 14px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; overflow-wrap: anywhere; }
    #DOX_navmenu .nav-link:hover { background: var(--surface-raised); color: var(--navlinkhover); border-color: var(--border); }
    #DOX_navmenu .nav-link.active { background: var(--accent-soft); border-color: var(--selected-border); color: var(--selected-text); font-weight: 700; box-shadow: inset 3px 0 var(--accent); }
    #DOX_navmenu .dox-up { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }

    /* Content cards separate documentation sections while keeping examples readable. */
    #DOX_content_wrapper { padding: 28px 36px 60px; min-width: 0; }
    .dox-topic-header { margin: 0 auto 24px; max-width: 1050px; }
    #DOX_location { color: var(--muted); font-size: .8rem; margin: 0 0 4px; overflow-wrap: anywhere; }
    #DOX_topic { font-size: 1.75rem; letter-spacing: -.025em; margin: 0; overflow-wrap: anywhere; }
    #DOX_content { max-width: 1050px; margin: 0 auto; }
    #DOX_content > .container-fluid { padding: 0; }
    .custom-section { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; background: var(--surface); overflow: hidden; box-shadow: 0 5px 18px #0002; }
    .section-title { padding: 12px 20px; background: var(--sectiontitlebg); color: var(--sectiontitle); font-size: .85rem; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .section-content { color: var(--sectioncontent); padding: 20px; overflow-wrap: anywhere; }
    .section-content > :last-child { margin-bottom: 0; }
    .dox-empty { padding: 28px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); }
    .DOX_intro { color: var(--text); }
    .DOX_intro .p-5 { padding: 28px !important; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .DOX_intro h1 { font-size: 1.6rem; }
    .DOX_intro .lead { font-size: 1rem; color: var(--muted); }
    pre { white-space: pre-wrap !important; overflow-wrap: anywhere; border-radius: 8px; font-size: .9rem; }
    .copy-to-clipboard-button { background: var(--button-background); color: var(--button-text); border: 1px solid var(--button-border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: .8rem; }
    .copy-to-clipboard-button:hover { background: var(--button-hover); }
    .section-content table { color: var(--text); --bs-table-bg: transparent; --bs-table-color: var(--text); --bs-table-border-color: var(--border); --bs-table-striped-color: var(--text); }

    /* Narrow screens retain both navigation and content without horizontal page overflow. */
    @media (max-width: 760px) {
        #titlebg, #DOX_breadcrumb-wrapper { padding-left: 20px; padding-right: 20px; }
        .dox-workspace { grid-template-columns: 1fr; }
        #DOX_navmenu_wrapper { border-right: 0; border-bottom: 1px solid var(--border); padding: 18px; }
        #DOX_navmenu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        #DOX_content_wrapper { padding: 24px 18px 40px; }
        .section-content { padding: 16px; }
    }

         data-bs-target=\"#collapseParsers\" aria-expanded=\"true\" aria-controls=\"collapseParsers\">\n          📦 Parsers\n        <\/button>\n      <\/h2>\n      <div id=\"collapseParsers\" class=\"accordion-collapse collapse show\"\n           aria-labelledby=\"headingParsers\" data-bs-parent=\"#doxAccordion\">\n        <div class=\"accordion-body\">\n          <p>Language-specific modules that scan your source for <code>--[[! … ]]<\/code> blocks and <code>@tags<\/code>, then emit <strong>DoxBlockTag<\/strong> objects.<\/p>\n          <ul>\n            <li><code>DoxSyntax.lua<\/code> – core tokenizer, finds raw tags and text<\/li>\n            <li><code>DoxLua.lua<\/code>, <code>DoxCPP.lua<\/code>, etc. – apply comment-style rules and normalize into <code>DoxBlockTag<\/code><\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- Components -->\n    <div class=\"accordion-item\">\n      <h2 class=\"accordion-header\" id=\"headingComponents\">\n        <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\"\n                data-bs-target=\"#collapseComponents\" aria-expanded=\"false\" aria-controls=\"collapseComponents\">\n          🔧 Components\n        <\/button>\n      <\/h2>\n      <div id=\"collapseComponents\" class=\"accordion-collapse collapse\"\n           aria-labelledby=\"headingComponents\" data-bs-parent=\"#doxAccordion\">\n        <div class=\"accordion-body\">\n          <p>Core in-memory models and the abstract builder interface.<\/p>\n          <ul>\n            <li><strong>DoxBlockTag.lua<\/strong> – represents one <code>@tag<\/code> (name, type, description)<\/li>\n            <li><strong>DoxBlock.lua<\/strong> – groups tags &amp; text into a logical block<\/li>\n            <li><strong>DoxBuilder.lua<\/strong> – abstract base with <code>refresh()<\/code> and <code>build()<\/code> signatures<\/li>\n            <li><strong>DoxMime.lua<\/strong> – escaping &amp; formatting helpers<\/li>\n n        <div class=\"accordion-body\">\n          <ol>\n            <li><strong>Parse<\/strong> source → <code>DoxBlockTag<\/code> → <code>DoxBlock<\/code><\/li>\n            <li><strong>Refresh<\/strong> in builder → nest by FQXN → <code>tFinalizedData<\/code><\/li>\n            <li><strong>Build<\/strong> in builder → serialize to HTML/JSON/CSON<\/li>\n            <li><strong>Output<\/strong> injected into docs or editor snippets<\/li>\n          <\/ol>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n<\/div><\/div><\/div><div class=\"custom-section\"><div id=\"35e2e72a-42b3-c2dd-cde0-bb07b5b43e21\" class=\"section-title\">Field(s) - Private<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>blockOpen<\/em>   Set during contruction, this is the string that tells Dox when to <strong>start<\/strong> reading a <a href=\"#Dox.Components.DoxBlock\">DoxBlock<\/a>.   <strong><em>string<\/em><\/strong>   <em>blockClose<\/em>   Set during contruction, this is the string that tells Dox when to <strong>stop<\/strong> reading a <a href=\"#Dox.Components.DoxBlock\">DoxBlock<\/a>.   <strong><em>table<\/em><\/strong>   <em>blockTags<\/em>   A complete list of <a href=\"#Dox.Components.DoxBlockTag\">DoxBlockTags<\/a> available to the instance.\n<br>It's built during construction by first importing all built-in <a href=\"#Dox.Components.DoxBlockTag\">DoxBlockTags<\/a>, then by creating and inserting the example <strong>BlockTags<\/strong> and finally by inputting all input varargs (input <strong>BlockTags<\/strong>) if any are provided.--TODO FINISH<br><\/div><\/div><div class=\"custom-section\"><div id=\"86d8970f-444b-907c-0a45-d008d510de46\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    --[[!\n        @fqxn Dox\n        @desc &lt;strong&gt;Dox&lt;/strong&gt; auto-generates documentation for code by reading and parsing comment blocks.\n        <br>&lt;br&gt;\n        <br>&lt;br&gt;Note:Dox is intended only to be used by being subclassed.\n        <br>&lt;br&gt;Subclasses of Dox (called parsers), provide the required parameters to properly parse comments blocks for specific languages.\n        @ex&lt;br&gt;--Many Wow! How Yay! Much Meta!\n        <br>&lt;br&gt;--...Meta End\n    !]]<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"f17edc97-06b8-1f4a-2bfb-738fb63efb6f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">--for this example, we're using Lua\n\n--create the Lua language parser object (with the project name)\nlocal oDoxLua = DoxLua(\"MyProject\");\n\n--import a directory recursively (read & parse files)\nlocal pImport = \"C:\\\\Path\\\\To\\\\My\\\\Project\"\n\nlocal function importFiles(pDir)\n\n    for _, pFile in pairs(io.listfiles(pDir, false, nil, \"lua\")) do\n        oDoxLua.importFile(pFile, true); --don't refresh the data until we're done importing\n        --print(pFile);\n    end\n\nend\n\nlocal tFolders = io.listdirs(pImport, true, importFiles); --set recursion to true\n\n--set the output path\noDoxLua.setOutputPath(\"C:\\\\Users\\\\MyUsername\\\\MyProject\");\n\n--[[we don't need to set a Dox.BUILDER since it defaults\n    to Dox.BUILDER.HTML and that's what we want]]\n\n--refresh the data\noDoxLua.refresh();\n\n--export html help file.\noDoxLua.export(); --profit!<\/code><\/pre><\/div><\/div><\/div>`,

class Dox {
    constructor() {
        if (Dox.instance) {
            return Dox.instance;
        }
        Dox.instance = this;
        this.data = doxData;
        this.activeFQXN = "Modules";
        this.restoreLocation();
        // Only local fragment links belong to the documentation navigator.
        document.body.addEventListener('click', (event) => {
            const anchor = event.target.closest('a[href]');
            if (!anchor || !anchor.getAttribute('href').startsWith('#')) {
                return;
            }
            const fragment = anchor.getAttribute('href').slice(1);
            if (!fragment) {
                event.preventDefault();
                return;
            }
            const path = this.pathFromFragment(fragment);
            if (this.fqxnIsValid(path)) {
                event.preventDefault();
                this.setActiveFQXN(path);
                this.updatePage();
            }
        });
        // History traversal renders the stored location without adding another entry.
        window.addEventListener('popstate', () => {
            this.restoreLocation();
            this.updatePage(false);
        });
        window.addEventListener('hashchange', () => {
            this.restoreLocation();
            this.updatePage(false);
        });
    }
    byID(id) {
        return document.getElementById(id);
    }
    static copyToClipboard(button) {
        const code = button.closest('.custom-section').querySelector('pre code, pre');
        if (!code) {
            return;
        }
        const textarea = document.createElement('textarea');
        textarea.value = code.textContent;
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        button.textContent = copied ? 'Copied' : 'Copy failed';
        window.setTimeout(() => { button.textContent = 'Copy'; }, 1500);
    }
    fqxnIsValid(path) {
        return this.getDataByFQDN(path) !== null;
    }
    getActiveFQXN() {
        return this.activeFQXN;
    }
    getDataByFQDN(path) {
        let current = this.data;
        let node = null;
        for (const part of path.split('.')) {
            if (!current || !Object.prototype.hasOwnProperty.call(current, part)) {
                return null;
            }
            node = current[part];
            current = node.subtable;
        }
        return node;
    }
    makeLink(path, label) {
        const anchor = document.createElement('a');
        anchor.href = '#' + path.replace(/^Modules\.?/, '');
        anchor.textContent = label.split('%20').join(' ');
        anchor.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            this.setActiveFQXN(path);
            this.updatePage();
        });
        return anchor;
    }
    pathFromFragment(fragment) {
        let decoded;
        try {
            decoded = decodeURIComponent(fragment);
        } catch (_) {
            return '';
        }
        return 'Modules.' + decoded.replace(/^Modules\.?/, '').split(' ').join('%20');
    }
    restoreLocation() {
        const path = window.location.hash ? this.pathFromFragment(window.location.hash.slice(1)) : 'Modules';
        this.activeFQXN = this.fqxnIsValid(path) ? path : 'Modules';
    }
    setActiveFQXN(path) {
        if (!this.fqxnIsValid(path)) {
            return false;
        }
        this.activeFQXN = path;
        return true;
    }
    updateBreadcrumb() {
        const breadcrumb = this.byID('DOX_breadcrumb');
        breadcrumb.replaceChildren();
        const parts = this.activeFQXN.split('.');
        parts.forEach((part, index) => {
            const item = document.createElement('li');
            item.className = 'breadcrumb-item';
            const label = index === 0 ? 'Overview' : part;
            if (index === parts.length - 1) {
                item.textContent = label.split('%20').join(' ');
                item.classList.add('active');
                item.setAttribute('aria-current', 'page');
            } else {
                item.appendChild(this.makeLink(parts.slice(0, index + 1).join('.'), label));
            }
            breadcrumb.appendChild(item);
        });
    }
    updateContent() {
        const node = this.getDataByFQDN(this.activeFQXN);
        const content = this.byID('DOX_content');
        content.innerHTML = node.value || '<div class="dox-empty">Choose a topic from the navigation to explore its documentation.</div>';
        this.byID('DOX_topic').textContent = this.activeFQXN === 'Modules' ? 'Documentation overview' : this.activeFQXN.split('.').slice(-1)[0].split('%20').join(' ');
        this.byID('DOX_location').textContent = this.activeFQXN.replace(/^Modules\.?/, '').split('%20').join(' ') || 'Explore the project reference';
    }
    updateNavMenu() {
        const menu = this.byID('DOX_navmenu');
        menu.replaceChildren();
        const active = this.getDataByFQDN(this.activeFQXN);
        const parentPath = this.activeFQXN.split('.').slice(0, -1).join('.');
        const groupPath = active.subtable ? this.activeFQXN : parentPath;
        const group = this.getDataByFQDN(groupPath);
        const upPath = groupPath.split('.').slice(0, -1).join('.');
        this.byID('DOX_navheading').textContent = groupPath === 'Modules' ? 'Project reference' : groupPath.split('.').slice(-1)[0].split('%20').join(' ');
        if (upPath) {
            const item = document.createElement('li');
            const anchor = this.makeLink(upPath, '← Back to parent');
            anchor.className = 'nav-link dox-up';
            item.appendChild(anchor);
            menu.appendChild(item);
        }
        Object.keys(group.subtable || {}).sort().forEach((key) => {
            const path = groupPath + '.' + key;
            const item = document.createElement('li');
            item.className = 'nav-item';
            const anchor = this.makeLink(path, key);
            anchor.className = 'nav-link';
            if (path === this.activeFQXN) {
                anchor.classList.add('active');
                anchor.setAttribute('aria-current', 'page');
            }
            item.appendChild(anchor);
            menu.appendChild(item);
        });
    }
    updatePage(recordHistory = true) {
        this.updateNavMenu();
        this.updateBreadcrumb();
        this.updateContent();
        Prism.highlightAll();
        if (recordHistory) {
            const hash = this.activeFQXN === 'Modules' ? '' : '#' + this.activeFQXN.slice(8);
            if (window.location.hash !== hash) {
                history.pushState({ activeFQXN: this.activeFQXN }, '', window.location.pathname + window.location.search + hash);
            }
        }
    }
}


    function bootDox() {
        const oDox = new Dox();
        oDox.updatePage(false);
    }

    if (window.Prism) {
        bootDox();
    } else {
        window.addEventListener('load', bootDox);
    }
    </script>
</body>
